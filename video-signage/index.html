<!DOCTYPE html>
<html>
  <head>
    <title>Video Signage</title>
    <style>
      body {
        background-color: black;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>

    <script>
      const defaultList = "PL_YnWo4XhzTcEQ1nFCzvxfklMv2kHbl9-";

      const hashes = getHashParameters();

      const debug = hashes?.debug ?? false;
      const tag = document.createElement("script");

      const videoId = hashes?.videoId;
      const start = Number(hashes?.start ?? 0) || 0;
      const loop = Number(hashes?.loop ?? 0) || 0;
      const list = hashes?.list ?? defaultList;

      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      let player;
      function onYouTubeIframeAPIReady() {
        if (videoId) {
          player = new YT.Player("player", {
            height: "1080",
            width: "1920",
            videoId,
            playerVars: {
              autoplay: 1,
              loop,
              controls: 0,
              start,
              rel: 0,
              // YouTube only loops a single video when playlist is also set to that video id
              ...(loop === 1 ? { playlist: videoId } : {}),
            },
            events: {
              onReady: onPlayerReady,
              onStateChange: onPlayerStateChange,
              onError: onPlayerError,
            },
          });
        } else {
          player = new YT.Player("player", {
            height: "1080",
            width: "1920",
            playerVars: {
              autoplay: 1,
              loop: 1,
              controls: 0,
              list,
              rel: 0
            },
            events: {
              onReady: onPlayerReady,
              onStateChange: onPlayerStateChange,
              onError: onPlayerError,
            },
          });
        }
      }

      // How long to wait after onReady for playback to begin before retrying
      const PLAY_WATCHDOG_MS = 6000;
      let playWatchdog;

      const stateNames = {
        "-1": "UNSTARTED",
        0: "ENDED",
        1: "PLAYING",
        2: "PAUSED",
        3: "BUFFERING",
        5: "CUED",
      };

      const errorMessages = {
        2: "Invalid video ID / parameter",
        5: "HTML5 player error",
        100: "Video not found, private, or removed",
        101: "Embedding disabled by the video owner",
        150: "Embedding disabled by the video owner",
      };

      function startPlayWatchdog(event) {
        clearTimeout(playWatchdog);
        playWatchdog = setTimeout(function () {
          if (player?.getPlayerState?.() === YT.PlayerState.PLAYING) return;
          console.warn(
            "Playback did not start within",
            PLAY_WATCHDOG_MS,
            "ms - retrying"
          );
          if (videoId) {
            player.loadVideoById({ videoId, startSeconds: start });
          }
          event.target.playVideo();
        }, PLAY_WATCHDOG_MS);
      }

      function onPlayerReady(event) {
        if(debug){
          console.debug("onPlayerReady event:", event);
        }
        console.log("Player Ready - Sending PlayVideo");
        event.target.playVideo();
        startPlayWatchdog(event);
      }

      function onPlayerStateChange(event) {
        console.log(
          "Player State Change:",
          stateNames[event.data] ?? "UNKNOWN",
          `(${event.data})`
        );

        if (event.data === YT.PlayerState.PLAYING) {
          clearTimeout(playWatchdog);
        }

        if (
          event.data == YT.PlayerState.ENDED &&
          videoId != undefined &&
          loop == 1
        ) {
          console.log("Player Ended - Sending PlayVideo");

          if(start > 0){
            player.seekTo(start);
          }
          player.playVideo();
        }
      }

      function onPlayerError(event) {
        const code = event.data;
        console.error(
          "Player Error:",
          code,
          "-",
          errorMessages[code] ?? "Unknown error"
        );
      }

      function stopVideo() {
        player.stopVideo();
      }

      function getHashParameters() {
        let hashString = location?.hash;
        if (!hashString || hashString == "") return {};
        const splitHash = hashString.substring(1).split("&");
        let hashes = {};
        for (let i = 0; i < splitHash.length; i++) {
          const [key, value] = splitHash[i].split("=");
          if (key) {
            hashes[decodeURI(key)] = decodeURI(value) ?? "";
          }
        }
        return hashes;
      }
    </script>
  </body>
</html>
